spring:
  application:
    name: orbit-flow
  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null

  # 게시글 사진 : 1장당 10MB(S3Service 검증과 동일), 최대 3장
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 31MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      timeout: 2000ms

  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


# 모니터링 : actuator는 외부에 공개하지 않는 별도 관리 포트에서만 제공
# Prometheus는 내부망에서 이 포트를 직접 수집하고, 운영 화면(Grafana 등)은 NGINX에서 IP 제한
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized